    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify PWA installability and API-cache safety baseline
        shell: pwsh
        run: ./scripts/verify-pwa-mobile-baseline.ps1
  accessibility-mobile-checklist:
    name: Accessibility/mobile checklist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
