name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  no-utf8-bom:
    name: No UTF-8 BOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify source files do not contain UTF-8 BOM
        shell: pwsh
        run: ./scripts/verify-no-utf8-bom.ps1
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed files for high-risk secret patterns
        shell: pwsh
        run: ./scripts/scan-secrets.ps1

  secret-scan-contract:
    name: Secret scan contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify secret scan coverage and CI wiring
        shell: pwsh
        run: ./scripts/verify-secret-scan-contract.ps1

  ci-workflow-contract:
    name: CI workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify CI workflow topology and release gate wiring
        shell: pwsh
        run: ./scripts/verify-ci-workflow-contract.ps1

  config-sync:
    name: Config sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify env example matches Spring config
        shell: pwsh
        run: ./scripts/verify-env-sync.ps1

  migration-discipline:
    name: DB migration discipline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify migration naming and versions
        shell: pwsh
        run: ./scripts/verify-db-migrations.ps1

  observability-alerts:
    name: Observability alert rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Prometheus alert rules are documented and loadable
        shell: pwsh
        run: ./scripts/verify-prometheus-alerts.ps1

  backup-rehearsal-runbook:
    name: Backup rehearsal runbook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify backup restore rehearsal runbook
        shell: pwsh
        run: ./scripts/verify-backup-rehearsal-runbook.ps1
  security-baseline-checklist:
    name: Security baseline checklist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify ASVS security baseline checklist
        shell: pwsh
        run: ./scripts/verify-security-baseline-checklist.ps1
  admin-audit-contract:
    name: Admin audit contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify high-risk admin action audit contract
        shell: pwsh
        run: ./scripts/verify-admin-audit-contract.ps1
  privacy-control-contract:
    name: Privacy control contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify user privacy control contract
        shell: pwsh
        run: ./scripts/verify-privacy-control-contract.ps1
  media-processing-contract:
    name: Media processing contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify large media and thumbnail processing contract
        shell: pwsh
        run: ./scripts/verify-media-processing-contract.ps1
  public-share-authorization-contract:
    name: Public share authorization contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify public share authorization contract
        shell: pwsh
        run: ./scripts/verify-public-share-authorization-contract.ps1
  file-upload-security-contract:
    name: File upload security contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify file upload security contract
        shell: pwsh
        run: ./scripts/verify-file-upload-security-contract.ps1
  pwa-mobile-baseline:
