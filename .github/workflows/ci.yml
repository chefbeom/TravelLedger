  household-budget-goals-contract:
    name: Household budget goals contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify household budget and shared goals contract
        shell: pwsh
        run: ./scripts/verify-household-budget-goals-contract.ps1
  drive-file-versioning-contract:
    name: Drive file versioning contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify Drive file versioning contract
        shell: pwsh
        run: ./scripts/verify-drive-file-versioning-contract.ps1
  data-portability-contract:
    name: Data portability contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify data portability contract
        shell: pwsh
        run: ./scripts/verify-data-portability-contract.ps1
  service-decomposition-plan:
    name: Service decomposition plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify service decomposition plan stays current
        shell: pwsh
        run: ./scripts/verify-service-decomposition-plan.ps1
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  backend-security-tests:
    name: Backend security-focused tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
