name: ${COMPOSE_PROJECT_NAME:-calen}

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MARIADB_DATABASE: ${DB_NAME:-calen}
      MARIADB_USER: ${DB_USER:-calen}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - calen-internal
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_EXTERNAL_URL:-http://localhost:9001}
    ports:
      - "${MINIO_API_EXTERNAL_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_EXTERNAL_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - calen-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live || curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local ${MINIO_API_INTERNAL_URL:-http://minio:9000} ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}; do
          echo "Waiting for MinIO..."
          sleep 2
        done
        mc mb --ignore-existing local/${MINIO_CLOUD_BUCKET:-budgetjourneybucket}
    networks:
      - calen-internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-Asia/Seoul}
      DB_URL: jdbc:mariadb://${DB_INTERNAL_HOST:-mariadb}:${DB_INTERNAL_PORT:-3306}/${DB_NAME:-calen}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Seoul
      DB_DRIVER: org.mariadb.jdbc.Driver
      DB_ID: ${DB_USER:-calen}
      DB_PASS: ${DB_PASSWORD:?DB_PASSWORD must be set}
      JWT_KEY: ${JWT_KEY:?JWT_KEY must be set}
      WITHDRAWAL_TASK_SEAL_KEY: ${WITHDRAWAL_TASK_SEAL_KEY:-}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      APP_SEED_ALLOW_INSECURE_DEFAULT_CREDENTIALS: ${APP_SEED_ALLOW_INSECURE_DEFAULT_CREDENTIALS:-false}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      REMEMBER_ME_SECURE_COOKIE: ${REMEMBER_ME_SECURE_COOKIE:-false}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_SMTP_CONNECTION_TIMEOUT: ${MAIL_SMTP_CONNECTION_TIMEOUT:-5000}
      MAIL_SMTP_TIMEOUT: ${MAIL_SMTP_TIMEOUT:-10000}
      MAIL_SMTP_WRITE_TIMEOUT: ${MAIL_SMTP_WRITE_TIMEOUT:-10000}
      APP_AUTH_EMAIL_VERIFICATION_ENABLED: ${APP_AUTH_EMAIL_VERIFICATION_ENABLED:-true}
      APP_AUTH_EMAIL_VERIFICATION_BASE_URL: ${APP_AUTH_EMAIL_VERIFICATION_BASE_URL:-}
      APP_AUTH_EMAIL_VERIFICATION_TOKEN_VALIDITY: ${APP_AUTH_EMAIL_VERIFICATION_TOKEN_VALIDITY:-30m}
      APP_AUTH_EMAIL_PENDING_CLEANUP_ENABLED: ${APP_AUTH_EMAIL_PENDING_CLEANUP_ENABLED:-true}
      APP_AUTH_EMAIL_VERIFICATION_FROM: ${APP_AUTH_EMAIL_VERIFICATION_FROM:-${MAIL_FROM:-}}
      APP_AUTH_KAKAO_ENABLED: ${APP_AUTH_KAKAO_ENABLED:-false}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}
      KAKAO_EXPECTED_APP_ID: ${KAKAO_EXPECTED_APP_ID:-}
      KAKAO_ADMIN_APP_ID: ${KAKAO_ADMIN_APP_ID:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
      KAKAO_FRONTEND_BASE_URL: ${KAKAO_FRONTEND_BASE_URL:-}
      KAKAO_AUTHORIZATION_URI: ${KAKAO_AUTHORIZATION_URI:-https://kauth.kakao.com/oauth/authorize}
      KAKAO_TOKEN_URI: ${KAKAO_TOKEN_URI:-https://kauth.kakao.com/oauth/token}
      KAKAO_USER_INFO_URI: ${KAKAO_USER_INFO_URI:-https://kapi.kakao.com/v2/user/me}
      KAKAO_TOKEN_INFO_URI: ${KAKAO_TOKEN_INFO_URI:-https://kapi.kakao.com/v1/user/access_token_info}
      KAKAO_UNLINK_URI: ${KAKAO_UNLINK_URI:-https://kapi.kakao.com/v1/user/unlink}
      APP_AUTH_KAKAO_CONNECT_TIMEOUT: ${APP_AUTH_KAKAO_CONNECT_TIMEOUT:-5s}
      APP_AUTH_KAKAO_READ_TIMEOUT: ${APP_AUTH_KAKAO_READ_TIMEOUT:-10s}
      DB_MIGRATION_ENABLED: ${DB_MIGRATION_ENABLED:-false}
      DB_MIGRATION_BASELINE_ON_MIGRATE: ${DB_MIGRATION_BASELINE_ON_MIGRATE:-true}
      DB_MIGRATION_BASELINE_VERSION: ${DB_MIGRATION_BASELINE_VERSION:-0}
      DB_MIGRATION_VALIDATE_ON_MIGRATE: ${DB_MIGRATION_VALIDATE_ON_MIGRATE:-true}
      H2_CONSOLE_ENABLED: ${H2_CONSOLE_ENABLED:-false}
      MINIO_API: ${MINIO_API_INTERNAL_URL:-http://minio:9000}
      MINIO_PUBLIC_API: ${MINIO_PUBLIC_API:-${MINIO_API_PUBLIC_URL:-http://localhost:9000}}
      MINIO_NAME: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_CLOUD_BUCKET: ${MINIO_CLOUD_BUCKET:-budgetjourneybucket}
      MINIO_WORKSPACE_BUCKET: ${MINIO_WORKSPACE_BUCKET:-calen-workspace}
      TRAVEL_EXCHANGE_RATE_BASE_URL: ${TRAVEL_EXCHANGE_RATE_BASE_URL:-https://api.frankfurter.dev/v1}
      TRAVEL_EXCHANGE_RATE_CACHE_MINUTES: ${TRAVEL_EXCHANGE_RATE_CACHE_MINUTES:-30}
      TRAVEL_PRESIGNED_UPLOAD_ENABLED: ${TRAVEL_PRESIGNED_UPLOAD_ENABLED:-false}
      LEDGER_OCR_ENABLED: ${LEDGER_OCR_ENABLED:-false}
      LEDGER_OCR_IMAGE_STORAGE_ID: ${LEDGER_OCR_IMAGE_STORAGE_ID:-}
      LEDGER_OCR_WORKFLOW_URL: ${LEDGER_OCR_WORKFLOW_URL:-}
      LEDGER_OCR_BASE_URL: ${LEDGER_OCR_BASE_URL:-}
      LEDGER_OCR_API_KEY: ${LEDGER_OCR_API_KEY:-}
      LEDGER_OCR_CONNECT_TIMEOUT: ${LEDGER_OCR_CONNECT_TIMEOUT:-3s}
      LEDGER_OCR_READ_TIMEOUT: ${LEDGER_OCR_READ_TIMEOUT:-90s}
      LEDGER_OCR_MAX_FILE_SIZE: ${LEDGER_OCR_MAX_FILE_SIZE:-10MB}
      LEDGER_OCR_MAX_PENDING_PER_USER: ${LEDGER_OCR_MAX_PENDING_PER_USER:-20}
      LEDGER_OCR_WORKERS: ${LEDGER_OCR_WORKERS:-3}
      LEDGER_OCR_QUEUE_CAPACITY: ${LEDGER_OCR_QUEUE_CAPACITY:-100}
      APP_EMBEDDING_ENABLED: ${APP_EMBEDDING_ENABLED:-false}
      APP_EMBEDDING_BASE_URL: ${APP_EMBEDDING_BASE_URL:-}
      APP_EMBEDDING_API_KEY: ${APP_EMBEDDING_API_KEY:-}
      APP_EMBEDDING_CONNECT_TIMEOUT: ${APP_EMBEDDING_CONNECT_TIMEOUT:-5s}
      APP_EMBEDDING_READ_TIMEOUT: ${APP_EMBEDDING_READ_TIMEOUT:-180s}
      APP_EMBEDDING_BATCH_SIZE: ${APP_EMBEDDING_BATCH_SIZE:-4}
      APP_EMBEDDING_CAPTURE_ENABLED: ${APP_EMBEDDING_CAPTURE_ENABLED:-false}
      APP_EMBEDDING_SYNC_POLL_INTERVAL: ${APP_EMBEDDING_SYNC_POLL_INTERVAL:-5s}
      APP_EMBEDDING_SYNC_LEASE_DURATION: ${APP_EMBEDDING_SYNC_LEASE_DURATION:-15m}
      APP_EMBEDDING_SYNC_MAX_ATTEMPTS: ${APP_EMBEDDING_SYNC_MAX_ATTEMPTS:-8}
      APP_EMBEDDING_SYNC_RETRY_BASE_DELAY: ${APP_EMBEDDING_SYNC_RETRY_BASE_DELAY:-10s}
      APP_EMBEDDING_SYNC_RETRY_MAX_DELAY: ${APP_EMBEDDING_SYNC_RETRY_MAX_DELAY:-15m}
      APP_EMBEDDING_SYNC_RECOVERY_DELAY: ${APP_EMBEDDING_SYNC_RECOVERY_DELAY:-1m}
      APP_EMBEDDING_SYNC_RECONCILE_INTERVAL: ${APP_EMBEDDING_SYNC_RECONCILE_INTERVAL:-24h}
      APP_LEDGER_AI_ENABLED: ${APP_LEDGER_AI_ENABLED:-true}
      APP_LEDGER_AI_PROVIDER: ${APP_LEDGER_AI_PROVIDER:-lmstudio}
      APP_LEDGER_AI_MODEL: ${APP_LEDGER_AI_MODEL:-auto}
      APP_LEDGER_AI_LMSTUDIO_BASE_URL: ${APP_LEDGER_AI_LMSTUDIO_BASE_URL:-}
      APP_LEDGER_AI_LMSTUDIO_CHAT_PATH: ${APP_LEDGER_AI_LMSTUDIO_CHAT_PATH:-/api/v1/chat}
      APP_LEDGER_AI_LMSTUDIO_MODELS_PATH: ${APP_LEDGER_AI_LMSTUDIO_MODELS_PATH:-/api/v1/models}
      APP_LEDGER_AI_LMSTUDIO_API_KEY: ${APP_LEDGER_AI_LMSTUDIO_API_KEY:-}
      APP_LEDGER_AI_TEMPERATURE: ${APP_LEDGER_AI_TEMPERATURE:-0.2}
      APP_LEDGER_AI_MAX_TOKENS: ${APP_LEDGER_AI_MAX_TOKENS:-4096}
      APP_LEDGER_AI_CONNECT_TIMEOUT: ${APP_LEDGER_AI_CONNECT_TIMEOUT:-3s}
      APP_LEDGER_AI_READ_TIMEOUT: ${APP_LEDGER_AI_READ_TIMEOUT:-600s}
      APP_LEDGER_AI_MAX_CONCURRENT: ${APP_LEDGER_AI_MAX_CONCURRENT:-20}
      APP_LEDGER_AI_MAX_WAITING: ${APP_LEDGER_AI_MAX_WAITING:-20}
      APP_LEDGER_AI_WAIT_TIMEOUT: ${APP_LEDGER_AI_WAIT_TIMEOUT:-30s}
      APP_LEDGER_AI_WORKERS: ${APP_LEDGER_AI_WORKERS:-1}
      APP_LEDGER_AI_QUEUE_CAPACITY: ${APP_LEDGER_AI_QUEUE_CAPACITY:-100}
      APP_HTTP_ASYNC_WORKERS: ${APP_HTTP_ASYNC_WORKERS:-8}
      APP_HTTP_MAP_WORKERS: ${APP_HTTP_MAP_WORKERS:-4}
      APP_HTTP_MAP_QUEUE_CAPACITY: ${APP_HTTP_MAP_QUEUE_CAPACITY:-32}
      APP_SHARED_SESSION_ENABLED: ${APP_SHARED_SESSION_ENABLED:-false}
      TRAVEL_REVERSE_GEOCODE_QUEUE_CAPACITY: ${TRAVEL_REVERSE_GEOCODE_QUEUE_CAPACITY:-16}
      APP_HTTP_ASYNC_QUEUE_CAPACITY: ${APP_HTTP_ASYNC_QUEUE_CAPACITY:-64}
      APP_HTTP_ASYNC_TIMEOUT_MILLIS: ${APP_HTTP_ASYNC_TIMEOUT_MILLIS:-600000}
      APP_HTTP_METRICS_HISTOGRAM_ENABLED: ${APP_HTTP_METRICS_HISTOGRAM_ENABLED:-true}
      DRIVE_MAX_ZIP_FILES: ${DRIVE_MAX_ZIP_FILES:-2000}
      DRIVE_MAX_ZIP_BYTES: ${DRIVE_MAX_ZIP_BYTES:-2147483648}
      APP_DRIVE_DIRECT_SHARE_AUDIT_ANONYMIZATION_ENABLED: ${APP_DRIVE_DIRECT_SHARE_AUDIT_ANONYMIZATION_ENABLED:-true}
      APP_UNKNOWN_LOGIN_AUDIT_ANONYMIZATION_ENABLED: ${APP_UNKNOWN_LOGIN_AUDIT_ANONYMIZATION_ENABLED:-true}
      APP_LEDGER_AI_ENFORCE_PROVIDER_URL_ALLOWLIST: ${APP_LEDGER_AI_ENFORCE_PROVIDER_URL_ALLOWLIST:-true}
      APP_LEDGER_AI_ALLOWED_PROVIDER_HOSTS: ${APP_LEDGER_AI_ALLOWED_PROVIDER_HOSTS:-localhost,127.0.0.1,::1}
      APP_LEDGER_AI_WORKFLOW_URL: ${APP_LEDGER_AI_WORKFLOW_URL:-}
      APP_LEDGER_AI_API_KEY: ${APP_LEDGER_AI_API_KEY:-}
      APP_LEDGER_AI_API_KEY_HEADER: ${APP_LEDGER_AI_API_KEY_HEADER:-X-TravelLedger-AI-Key}
      TRAVEL_MEDIA_STORAGE_PATH: /app/uploads/travel-media
      FAMILY_MEDIA_STORAGE_PATH: /app/uploads/family-media
      SUPPORT_ATTACHMENT_STORAGE_ID: ${SUPPORT_ATTACHMENT_STORAGE_ID:-}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0
    expose:
      - "8080"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - calen-internal
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_HOST: ${BACKEND_INTERNAL_HOST:-backend}
      BACKEND_INTERNAL_PORT: ${BACKEND_INTERNAL_PORT:-8080}
    ports:
      - "${APP_EXTERNAL_PORT:-8080}:80"
    networks:
      - calen-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mariadb-data:
  minio-data:
  backend-uploads:

networks:
  calen-internal:
    driver: bridge

